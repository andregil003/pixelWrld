<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ascii-pueblo v7 — de vuelta al texto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #010603;
    font-family: "Cascadia Mono", Consolas, Menlo, monospace; }
  #wrap { height: 100vh; width: 100vw; display: flex; flex-direction: column; }
  #topbar { display: flex; gap: 18px; align-items: center; padding: 6px 14px;
    font-size: 12px; letter-spacing: 1px; z-index: 10;
    background: rgba(0,0,0,.5); color: #d8ffd8; white-space: nowrap; }
  #topbar b { letter-spacing: 2px; }
  #screen { flex: 1; position: relative; overflow: hidden; cursor: crosshair; background: #010603;
    display: flex; align-items: center; justify-content: center; }
  #cv { display: block; }
  #scan { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: .12;
    background: repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px); }
  #cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 15px; pointer-events: none; opacity: .9; z-index: 4; color: #fff; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 12px; padding: 4px 12px; border-radius: 4px; z-index: 4;
    background: rgba(0,0,0,.55); color: #d8ffd8; pointer-events: none; white-space: nowrap; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.82); color: #d8ffd8; font-size: 14px; line-height: 1.8;
    text-align: center; cursor: pointer; z-index: 5; padding: 20px; }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: 26px; letter-spacing: 3px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar"><span><b>ASCII-PUEBLO v7</b> · texto 3D</span><span id="fps">…</span><span id="pos"></span><span id="phase"></span></div>
  <div id="screen">
    <canvas id="cv"></canvas>
    <div id="scan"></div>
    <div id="cross">+</div>
    <div id="toast">WASD moverse · mouse mirar · SHIFT correr · N día/noche · -/= letra</div>
    <div id="overlay"><div>
      <div class="big">ASCII-PUEBLO v7</div>
      <div>un mundo 3D hecho SOLO de texto</div><br>
      <div><b>CLICK PARA JUGAR</b></div><br>
      <div>WASD + mouse · SHIFT corre · N cambia día/noche · -/= letra</div>
    </div></div>
  </div>
</div>
<script>
// ================= MAPA GRANDE Y DENSO (48x36) =================
// #:piedra H:madera D:puerta W:ventana T:árbol L:farol ~:lago .:suelo
const MW = 48, MH = 36;
const grid = [], fgrid = [];
for (let y = 0; y < MH; y++) {
  const r = [], f = [];
  for (let x = 0; x < MW; x++) {
    r.push((x === 0 || y === 0 || x === MW - 1 || y === MH - 1) ? "#" : ".");
    f.push("grass");
  }
  grid.push(r); fgrid.push(f);
}
let _s = 777;
function rnd() { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function house(hx, hy, w, h, door) {
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) grid[hy + y][hx + x] = "H";
  const mid = hx + (w >> 1), midY = hy + (h >> 1);
  grid[hy][mid - 1] = "W"; grid[hy][mid + 1] = "W";
  if (w > 6) { grid[hy][mid - 2] = "W"; grid[hy][mid + 2] = "W"; }
  grid[hy + 1][hx] = "W"; grid[hy + 1][hx + w - 1] = "W";
  if (door === "S") grid[hy + h - 1][mid] = "D";
  if (door === "N") grid[hy][mid] = "D";
  if (door === "E") grid[midY][hx + w - 1] = "D";
  if (door === "W") grid[midY][hx] = "D";
}
house(4, 3, 7, 5, "S"); house(16, 2, 7, 5, "S"); house(28, 3, 7, 5, "S");
house(4, 13, 7, 5, "N"); house(28, 13, 7, 5, "N"); house(16, 24, 8, 5, "N");
for (let x = 18; x <= 27; x++) for (let y = 18; y <= 22; y++) fgrid[y][x] = "plaza"; // plaza frente a F
function pathV(x, y0, y1) { for (let y = y0; y <= y1; y++) if (grid[y][x] === ".") fgrid[y][x] = "path"; }
function pathH(y, x0, x1) { for (let x = x0; x <= x1; x++) if (grid[y][x] === ".") fgrid[y][x] = "path"; }
pathV(13, 1, 34); pathV(32, 1, 34);
pathH(8, 1, 46); pathH(17, 1, 46); pathH(27, 1, 40);
function lake(cx, cy, rx, ry) {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const dx = (x - cx) / rx, dy = (y - cy) / ry;
    if (dx * dx + dy * dy < 1 && grid[y][x] === ".") grid[y][x] = "~";
  }
}
lake(41, 28, 5, 4); lake(7, 30, 4, 3);
for (let x = 3; x <= 9; x++) { if (grid[10][x] === ".") grid[10][x] = "#"; }
for (let x = 36; x <= 44; x++) { if (grid[21][x] === ".") grid[21][x] = "#"; }
[[12,7],[14,9],[31,7],[33,9],[12,16],[14,19],[31,16],[33,19],[12,26],[14,28],[22,16],[25,16]].forEach(([x,y]) => { if (grid[y][x] === ".") grid[y][x] = "L"; });
for (let i = 0; i < 90; i++) {
  const x = 2 + Math.floor(rnd() * (MW - 4)), y = 2 + Math.floor(rnd() * (MH - 4));
  if (grid[y][x] === "." && fgrid[y][x] === "grass") grid[y][x] = "T";
}
function tileAt(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 0 || iy < 0 || ix >= MW || iy >= MH) return "#";
  return grid[iy][ix];
}
function floorAt(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 0 || iy < 0 || ix >= MW || iy >= MH) return "grass";
  if (grid[iy][ix] === "~") return "water";
  return fgrid[iy][ix];
}
function solidAt(x, y) { const t = tileAt(x, y); return "#HDWTL".includes(t); }

// ================= RENDERER TEXTO A COLOR =================
let FONT = 11, COLS = 200, ROWS = 90, Q = 1;
const FOV = Math.PI / 3;
const screen = document.getElementById("screen");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let cw = 6;
function fit() {
  ctx.font = FONT + 'px "Cascadia Mono",Consolas,monospace';
  cw = ctx.measureText("M").width;
  const w = screen.clientWidth - 8, h = screen.clientHeight - 8;
  COLS = Math.max(100, Math.min(380, Math.floor(w / cw * Q)));
  ROWS = Math.max(50, Math.min(150, Math.floor(h / FONT * Q)));
  ctx.font = FONT + 'px "Cascadia Mono",Consolas,monospace';
  cv.width = Math.max(1, Math.floor(COLS * cw)); cv.height = Math.max(1, ROWS * FONT);
}
let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(fit, 120); });

let px = 13.5, py = 32.5, ang = -1.45;
let keys = {}, locked = false;
let dayT = 0.15, autoDay = true;
const DAY_LEN = 120;

function palette() {
  const t = ((dayT % 1) + 1) % 1;
  if (t < 0.30) return { name: "☀ DÍA", bg: "#0a1826", sky: "#9fc7e8",
    hillF: "#4a6a52", hillN: "#2e4a34", cloud: "#e8f2fa",
    grass1: "#46b155", grass2: "#2e7d3a", path: "#b08d57", plaza: "#a8adb5",
    sand: "#e0cf9a", wat1: "#2e98d4", wat2: "#7fd4f2",
    stone: "#c4c4c4", stoneD: "#7a7a7a", wood: "#c08a48", woodD: "#6e4520",
    roof: "#e04838", roofD: "#8e2b22", glass: "#d8f2ff",
    trunk: "#9a6a3a", leaf: "#3fd05a", leafD: "#1f6b2d", lamp: "#666",
    flower: ["#ff5f7a", "#ffd94d", "#ffffff", "#c07fff"] };
  if (t < 0.45) return { name: "🌇 ATARDECER", bg: "#160f24", sky: "#7a4a6a",
    hillF: "#4a3048", hillN: "#2c1c38", cloud: "#ff9e7a",
    grass1: "#3a7a3f", grass2: "#26522b", path: "#7a5c38", plaza: "#6a6a72",
    sand: "#c9a86a", wat1: "#4a5a9e", wat2: "#ff9e7a",
    stone: "#9a8a9a", stoneD: "#5e5460", wood: "#8a5c30", woodD: "#4e3018",
    roof: "#a83428", roofD: "#571a14", glass: "#ffd75e",
    trunk: "#5c3c22", leaf: "#228040", leafD: "#143f20", lamp: "#4a4a4a",
    flower: ["#e8546d", "#ffd94d", "#ffffff", "#b678e8"] };
  if (t < 0.80) return { name: "🌙 NOCHE", bg: "#010603", sky: "#0a1220",
    hillF: "#0e1c28", hillN: "#060d16", cloud: "#1a2436",
    grass1: "#16452a", grass2: "#0b2716", path: "#35301f", plaza: "#33383f",
    sand: "#57503a", wat1: "#0e3a5e", wat2: "#1a6a9e",
    stone: "#5a6a5a", stoneD: "#2a362a", wood: "#5c4a2c", woodD: "#2e2416",
    roof: "#4a2626", roofD: "#241212", glass: "#ffd75e",
    trunk: "#3a2e1c", leaf: "#146031", leafD: "#092214", lamp: "#3a3a3a",
    flower: ["#e8546d", "#ffd94d", "#ffffff", "#b678e8"] };
  return { name: "🌅 AMANECER", bg: "#101426", sky: "#8a7a9e",
    hillF: "#4e6248", hillN: "#304038", cloud: "#ffc49e",
    grass1: "#3a8a44", grass2: "#265c2e", path: "#8a6a42", plaza: "#7a7a82",
    sand: "#d4b47a", wat1: "#3a7aae", wat2: "#9ed4e8",
    stone: "#a89a92", stoneD: "#645c58", wood: "#96683a", woodD: "#5c3c1e",
    roof: "#b0382c", roofD: "#682118", glass: "#ffe6a0",
    trunk: "#66452a", leaf: "#2a8c48", leafD: "#185425", lamp: "#4a4a4a",
    flower: ["#e8546d", "#ffd94d", "#ffffff", "#b678e8"] };
}
const isNight = () => { const t = ((dayT % 1) + 1) % 1; return t >= 0.45 && t < 0.80; };
const isDay = () => ((dayT % 1) + 1) % 1 < 0.30;

function castRay(a) {
  const dx = Math.cos(a), dy = Math.sin(a);
  let mx = Math.floor(px), my = Math.floor(py);
  const ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
  let sx, sy, stx, sty;
  if (dx < 0) { stx = -1; sx = (px - mx) * ddx; } else { stx = 1; sx = (mx + 1 - px) * ddx; }
  if (dy < 0) { sty = -1; sy = (py - my) * ddy; } else { sty = 1; sy = (my + 1 - py) * ddy; }
  let side = 0, tile = "#", g = 0;
  while (g++ < 128) {
    if (sx < sy) { sx += ddx; mx += stx; side = 0; } else { sy += ddy; my += sty; side = 1; }
    tile = tileAt(mx, my);
    if ("#HDWTL".includes(tile)) break;
  }
  const d = Math.max(0.05, (side === 0 ? sx - ddx : sy - ddy)) * Math.cos(a - ang);
  return { dist: d, side, tile };
}
function hash(x, y) {
  let h = (Math.floor(x) * 374761393 + Math.floor(y) * 668265263) | 0;
  h = (h ^ (h >> 13)) | 0; h = (h * 1274126177) | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
const RAMP = "@%#*+=-:. ";
const WAVES = ["~", "≈", "–"];

let T = 0;
function render(dt) {
  T += dt;
  const P = palette(), night = isNight(), day = isDay();
  const horizon = Math.floor(ROWS * 0.40);
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textBaseline = "top"; ctx.textAlign = "left";
  const sunW = dayT * Math.PI * 2, moonW = sunW + Math.PI;
  let runC = null, runS = "", runX = 0;
  const emit = (gx, gy, ch, css) => {
    if (ch === null) { if (runS) { ctx.fillStyle = runC; ctx.fillText(runS, runX * cw, gy * FONT); runS = ""; } runC = null; return; }
    if (css !== runC) { if (runS) { ctx.fillStyle = runC; ctx.fillText(runS, runX * cw, gy * FONT); runS = ""; } runC = css; runX = gx; }
    runS += ch;
  };
  for (let gy = 0; gy < ROWS; gy++) {
    runC = null; runS = "";
    for (let gx = 0; gx < COLS; gx++) {
      const cam = (gx / COLS - 0.5) * FOV, wa = ang + cam;
      let ch = null, css = null;
      if (gy < horizon) {
        const f1 = Math.sin(wa * 2.6) * 0.5 + Math.sin(wa * 6.1 + 1.7) * 0.3 + Math.sin(wa * 12.3) * 0.2;
        const f2 = Math.sin(wa * 4.4 + 3.0) * 0.5 + Math.sin(wa * 9.7 + 0.6) * 0.5;
        const farTop = Math.floor(horizon - ROWS * 0.12 - f1 * ROWS * 0.05);
        const nearTop = Math.floor(horizon - ROWS * 0.03 - (f2 * 0.5 + 0.5) * ROWS * 0.09);
        if (gy < farTop - 1) {
          const dS = Math.abs(((wa - sunW + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
          const sY = horizon * 0.35;
          const dM = Math.abs(((wa - moonW + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
          if (!night && dS * COLS < 3 && Math.abs(gy - sY) < 2.2) { ch = "@"; css = "#ffd94d"; }
          else if (night && dM * COLS < 2.5 && Math.abs(gy - sY) < 1.8) { ch = "O"; css = "#e8ecf4"; }
          else if (night && hash(gx, gy) > 0.993 && Math.sin(T * 2 + gx * 0.7) > -0.2) { ch = "*"; css = "#ffffff"; }
          else if (!night && gy < horizon * 0.75 && hash(Math.floor((gx + T * 3) / 9), Math.floor(gy / 4)) > 0.78) { ch = "~"; css = P.cloud; }
          else if (day && ((gx * 7 + gy * 13 + Math.floor(T * 8)) % 271 === 0)) { ch = "v"; css = P.hillN; }
        }
        else if (gy < nearTop) { ch = "^"; css = P.hillF; }
        else { ch = "n"; css = P.hillN; }
      } else {
        const { dist, side, tile } = castRay(wa);
        const wallH = ROWS / (dist * 1.25); // muros altos: menos cielo vacío
        const mid = horizon + (ROWS - horizon) * 0.30;
        const top = mid - wallH / 2, bot = mid + wallH / 2;
        if (gy < top) { emit(gx, gy, null); continue; }
        if (gy <= bot) {
          if (dist > 12) { ch = ":"; css = P.sky; }
          else {
            const vy = (gy - top) / Math.max(1, wallH);
            const dark = side === 1;
            const t = Math.min(1, dist / 11);
            const sh = RAMP[Math.min(RAMP.length - 1, Math.floor(t * RAMP.length))];
            if (tile === "#") { ch = sh; css = dark ? P.stoneD : P.stone; }
            else if (tile === "H" || tile === "D" || tile === "W") {
              if (vy < 0.20) { ch = "="; css = dark ? P.roofD : P.roof; }
              else if (tile === "W" && vy > 0.28 && vy < 0.60) { ch = night ? "O" : "o"; css = P.glass; }
              else if (tile === "D" && vy > 0.20) { ch = "#"; css = "#3a2412"; }
              else { ch = sh === " " ? "=" : sh; css = dark ? P.woodD : P.wood; }
            }
            else if (tile === "T") {
              if (vy < 0.55) { ch = "&%#"[Math.floor(hash(gx * 3, gy * 2) * 3)]; css = dark ? P.leafD : P.leaf; }
              else { ch = "|"; css = P.trunk; }
            }
            else if (tile === "L") {
              if (vy < 0.32) { ch = "@"; css = night ? "#ffd75e" : "#999999"; }
              else { ch = "|"; css = P.lamp; }
            }
            else { ch = sh; css = dark ? P.stoneD : P.stone; }
          }
        } else {
          const pd = ((ROWS * 0.5) / Math.max(1, gy - mid)) * 1.1 / Math.max(0.35, Math.cos(cam));
          const wx = px + Math.cos(wa) * pd * 1.6, wy = py + Math.sin(wa) * pd * 1.6;
          const ft = floorAt(wx, wy);
          const nearW = tileAt(wx + 0.25, wy) === "~" || tileAt(wx, wy + 0.25) === "~" ||
                        tileAt(wx - 0.25, wy) === "~" || tileAt(wx, wy - 0.25) === "~";
          if (ft === "water") {
            ch = WAVES[((Math.floor(T * 2.2 + wx + wy) % 3) + 3) % 3];
            css = (Math.floor(wx + wy + T * 2) % 2) ? P.wat1 : P.wat2;
          }
          else if (nearW) { ch = ":"; css = P.sand; }
          else if (ft === "path") { ch = hash(wx * 2, wy * 2) > 0.55 ? "," : "."; css = P.path; }
          else if (ft === "plaza") { ch = (Math.floor(wx) + Math.floor(wy)) % 2 ? "#" : "."; css = P.plaza; }
          else if (pd > 11) { ch = null; }
          else {
            const hf = hash(wx * 3, wy * 3);
            if (!night && hf > 0.990) { ch = "*"; css = P.flower[Math.floor(hash(wx * 7, wy * 7) * 4)]; }
            else if (night) { ch = hf > 0.82 ? "." : null; css = P.grass1; }
            else { ch = hf > 0.72 ? "." : ","; css = hf > 0.45 ? P.grass1 : P.grass2; }
          }
        }
      }
      emit(gx, gy, ch, css);
    }
    if (runS) { ctx.fillStyle = runC; ctx.fillText(runS, runX * cw, gy * FONT); runS = ""; }
  }
  document.getElementById("phase").textContent = P.name + (autoDay ? " · auto" : " · manual");
}

// ================= LOOP =================
const fpsEl = document.getElementById("fps"), posEl = document.getElementById("pos");
const overlay = document.getElementById("overlay");
let last = performance.now(), frames = 0, ftime = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (autoDay) dayT = (dayT + dt / DAY_LEN) % 1;
  const run = keys["shift"] ? 1.8 : 1, sp = 3.4 * run * dt;
  const fw = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
  const st = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
  if (keys["arrowleft"]) ang -= 2.2 * dt;
  if (keys["arrowright"]) ang += 2.2 * dt;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const nx = px + (dx * fw - dy * st) * sp, ny = py + (dy * fw + dx * st) * sp, r = 0.20;
  if (!solidAt(nx + Math.sign(nx - px) * r, py)) px = nx;
  if (!solidAt(px, ny + Math.sign(ny - py) * r)) py = ny;
  render(dt);
  frames++; ftime += dt;
  if (ftime >= 1.5) {
    const fps = frames / ftime;
    if (fps < 22 && Q > 0.4) { Q = Math.max(0.4, Q * 0.85); fit(); }
    else if (fps > 55 && Q < 1) { Q = Math.min(1, Q + 0.1); fit(); }
    fpsEl.textContent = Math.round(fps) + " fps · " + COLS + "x" + ROWS + " @" + FONT + "px";
    posEl.textContent = "x" + px.toFixed(0) + " y" + py.toFixed(0);
    frames = 0; ftime = 0;
  }
  requestAnimationFrame(loop);
}

// ================= INPUT =================
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === "-") { FONT = Math.max(8, FONT - 1); fit(); }
  if (k === "=" || k === "+") { FONT = Math.min(14, FONT + 1); fit(); }
  if (k === "n") { dayT = (dayT + 0.25) % 1; autoDay = false; }
  if (k === "h") { autoDay = !autoDay; }
  if (k === "f") { const s = document.getElementById("scan"); s.style.display = s.style.display === "none" ? "block" : "none"; }
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
overlay.addEventListener("click", () => screen.requestPointerLock());
screen.addEventListener("click", () => { if (!locked) screen.requestPointerLock(); });
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === screen;
  overlay.classList.toggle("hidden", locked);
});
document.addEventListener("mousemove", e => {
  if (!locked) return;
  ang += e.movementX * 0.0026;
});

fit(); setTimeout(fit, 60);
requestAnimationFrame(loop);
</script>
</body>
</html>
