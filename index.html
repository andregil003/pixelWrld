        if (HIT.face >= 2) { // sol direccional cálido/frío + AO de contacto
          const sgn = HIT.face === 2 ? -Math.sign(dx) : -Math.sign(dz);
          const sd = S.sun ? sgn * (HIT.face === 2 ? S.sun[0] : S.sun[2]) : sgn * (S.moon ? (HIT.face === 2 ? S.moon[0] : S.moon[2]) : 0) * 0.5;
          if (sd > 0) { r *= 1 + 0.12 * sd; g *= 1 + 0.04 * sd; b *= 1 - 0.10 * sd; }
          else { r *= 1 + 0.10 * sd; g *= 1 + 0.06 * sd; b *= 1 - 0.14 * sd; }
          const hx3 = Math.floor(eyeX + dx * ht), hy3 = Math.floor(eyeY + dy * ht), hz3 = Math.floor(eyeZ + dz * ht);
          const ab = getB(hx3, hy3 + 1, hz3);
          if (ab !== 0 && ab !== 5) { r *= 0.62; g *= 0.62; b *= 0.62; }
        }
        if (hb === 1 && HIT.face === 0) { // pasto con textura + puntitos (sin cubos)
          const gxw = Math.floor(eyeX + dx * ht), gzw = Math.floor(eyeZ + dz * ht);
          const hv = hash2(gxw * 3 + 1, gzw * 3 + 7);
          if (hv > 0.72) { r *= 0.86; g *= 0.93; b *= 0.86; } else if (hv < 0.22) { r *= 1.07; g *= 1.06; }
          if (S.light > 0.4 && !uw) {
            const fl = hash2(gxw * 5 + 9, gzw * 5 + 3);
            if (fl > 0.986) {
              const fc = [[232,84,109],[255,217,77],[245,245,245]][Math.floor(fl * 97) % 3];
              r = fc[0] * S.light; g = fc[1] * S.light; b = fc[2] * S.light;
            }
          }
        }
        if (uw) { r = r * 0.4 + 10; g = g * 0.6 + 40; b = b * 0.8 + 70; }
        if (HIT.w) { // agua + brillo del sol/luna temblando
          const k = 0.55;
          r += (70 * S.light - r) * k; g += (160 * S.light - g) * k; b += (220 * S.light - b) * k;
          const sdir = S.sun || S.moon;
          if (sdir && !uw) {
            const wx = eyeX + dx * HIT.w.t, wz = eyeZ + dz * HIT.w.t;
            const wo = (hash2(Math.floor(wx * 2 + T * 3), Math.floor(wz * 2)) - 0.5) * 0.35;
            const spk = Math.pow(Math.max(0, dx * sdir[0] + (-dy + wo) * sdir[1] + dz * sdir[2]), 24) * (S.sun ? 0.85 : 0.4);
            if (spk > 0) { r = Math.min(255, r + 255 * spk); g = Math.min(255, g + 240 * spk); b = Math.min(255, b + 200 * spk); }
          }
        }
        if (glowOn && ht < 16) { // halo cálido apretado en faroles (ya no lucesotas)
          const hx2 = eyeX + dx * ht, hy2 = eyeY + dy * ht, hz2 = eyeZ + dz * ht;
          let gl = 0;
          for (let li2 = 0; li2 < LAMPS.length; li2++) {
            const L = LAMPS[li2];
            const ax = hx2 - L[0]; if (ax > 6 || ax < -6) continue;
            const ay = hy2 - L[1]; if (ay > 6 || ay < -6) continue;
            const az = hz2 - L[2]; if (az > 6 || az < -6) continue;
            const dd = Math.sqrt(ax * ax + ay * ay + az * az) / 6;
            const gg = (1 - dd) * (1 - dd) * 0.6;
            if (gg > gl) gl = gg;
          }
          if (gl > 0) { r += (255 - r) * gl * 0.7; g += (180 - g) * gl * 0.7; b += (80 - b) * gl * 0.7; }
        }
        const f2 = 1 - Math.exp(-ht * fogK);
        r += (fogC[0] - r) * f2; g += (fogC[1] - g) * f2; b += (fogC[2] - b) * f2;
      }
      d[p++] = r; d[p++] = g; d[p++] = b; d[p++] = 255;
    }
  }
  bctx.putImageData(img, 0, 0);
  // --- partículas proyectadas ---
  const fx0 = -cp * sy, fy0 = sp, fz0 = -cp * cy;
  const ux0 = sy * sp, uy0 = cp, uz0 = cy * sp;
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const P2 = PARTS[i];
    P2.life -= dt;
    if (P2.life <= 0) { PARTS.splice(i, 1); continue; }
    P2.x += P2.vx * dt; P2.y += P2.vy * dt; P2.z += P2.vz * dt;
    if (P2.c === 2) P2.x += Math.sin(T * 3 + P2.z) * dt * 0.6; // hojas a la deriva
    const rx = P2.x - eyeX, ry = P2.y - eyeY, rz = P2.z - eyeZ;
    const cxp = rx * fx0 + ry * fy0 + rz * fz0;
    if (cxp < 0.6) continue;
    const up2 = rx * ux0 + ry * uy0 + rz * uz0;
    const sxp = Math.floor((rx * cy + rz * -sy) / (cxp * tanH) * 0.5 * BW + BW / 2);
    const syp = Math.floor(BH / 2 - up2 / (cxp * tanV) * 0.5 * BH);
    if (sxp < 0 || syp < 0 || sxp >= BW || syp >= BH) continue;
    if (P2.c === 1 && Math.sin(T * 6 + P2.x * 3 + P2.z * 2) <= 0) continue; // luciérnagas parpadean
    bctx.fillStyle = PCOL[P2.c];
    bctx.fillRect(sxp, syp, P2.c === 3 ? 2 : 1, 1);
  }
  // --- emisores ---
  for (let li3 = 0; li3 < LAMPS.length; li3++) {
    const L = LAMPS[li3];
    const ex = L[0] - eyeX, ey = L[1] - eyeY, ez = L[2] - eyeZ;
    if (ex * ex + ey * ey + ez * ez > 625) continue;
    if (Math.random() < dt * 8) spawnP(L[0] + (Math.random() - 0.5) * 0.5, L[1], L[2] + (Math.random() - 0.5) * 0.5,
      (Math.random() - 0.5) * 0.3, 0.5 + Math.random() * 0.5, (Math.random() - 0.5) * 0.3, 0.8, 0);
  }
  if (night && PARTS.length < 100 && Math.random() < dt * 20) // luciérnagas
    spawnP(eyeX + (Math.random() - 0.5) * 36, eyeY - 1 + Math.random() * 3, eyeZ + (Math.random() - 0.5) * 36,
      (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.5, 4, 1);
  if (day && PARTS.length < 100 && Math.random() < dt * 10) // hojas al viento
    spawnP(eyeX + (Math.random() - 0.5) * 28, eyeY + 2 + Math.random() * 4, eyeZ + (Math.random() - 0.5) * 28,
      (Math.random() - 0.5) * 0.6, -0.5 - Math.random() * 0.4, (Math.random() - 0.5) * 0.6, 5, 2);
  for (let si = 0; si < SMOKE.length; si++) { // humo de chimeneas
    const E2 = SMOKE[si];
    const ex = E2[0] - eyeX, ey = E2[1] - eyeY, ez = E2[2] - eyeZ;
    if (ex * ex + ey * ey + ez * ez > 1600) continue;
    if (Math.random() < dt * 5) spawnP(E2[0], E2[1], E2[2],
      (Math.random() - 0.5) * 0.3, 0.8 + Math.random() * 0.4, (Math.random() - 0.5) * 0.3, 2.2, 3);
  }
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(buf, 0, 0, cv.width, cv.height);
  if (uw) { ctx.fillStyle = "rgba(20,90,160,0.25)"; ctx.fillRect(0, 0, cv.width, cv.height); }
  document.getElementById("phase").textContent = S.name + (autoDay ? " · auto" : " · manual");
}

// ================= FÍSICA =================
function collideAt(nx, ny, nz) {
  for (const ox of [-0.3, 0.3]) for (const oz of [-0.3, 0.3]) for (const oy of [0, 0.9, 1.79]) {
    if (solidB(getB(Math.floor(nx + ox), Math.floor(ny + oy), Math.floor(nz + oz)))) return true;
  }
  return false;
}
function moveY(dy) {
  if (dy === 0) return;
  const n = Math.max(1, Math.ceil(Math.abs(dy) / 0.5)), st = dy / n;
  for (let i = 0; i < n; i++) {
    const ny2 = py + st;
    if (collideAt(px, ny2, pz)) { if (vy < 0) { py = Math.floor(ny2) + 1; grounded = true; } vy = 0; return; }
    py = ny2;
  }
  if (vy !== 0) grounded = false;
}
// ================= LOOP =================
const fpsEl = document.getElementById("fps"), posEl = document.getElementById("pos");
const overlay = document.getElementById("overlay");
let last = performance.now(), frames = 0, ftime = 0;
function groundTop(x, z) {
  for (let y = WY - 1; y >= 0; y--) if (solidB(getB(Math.floor(x), y, Math.floor(z)))) return y + 1;
  return 1;
}
py = groundTop(px, pz);
{ let gd = 0; while (collideAt(px, py, pz) && gd++ < 8) py += 1; }
if (getB(Math.floor(px), Math.floor(py + 0.4), Math.floor(pz)) === 5) { px += 2.5; py = groundTop(px, pz); }
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (autoDay) dayT = (dayT + dt / DAY_LEN) % 1;
  const inWater = getB(Math.floor(px), Math.floor(py + 0.4), Math.floor(pz)) === 5;
  const run = keys["shift"] ? 1.55 : 1;
  const sp = inWater ? 2.4 : 4.3 * run;
  const fw = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
  const st = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
  const sy2 = Math.sin(yaw), cy2 = Math.cos(yaw);
  const fxw = -sy2, fzw = -cy2;
  const rX = cy2, rZ = -sy2;
  const dx = (fxw * fw + rX * st) * sp * dt;
  const dz = (fzw * fw + rZ * st) * sp * dt;
  if (!collideAt(px + dx, py, pz)) px += dx;
  else if (!collideAt(px + dx, py + 1.05, pz)) { px += dx; py += 1.05; vy = 0; grounded = true; }
  if (!collideAt(px, py, pz + dz)) pz += dz;
  else if (!collideAt(px, py + 1.05, pz + dz)) { pz += dz; py += 1.05; vy = 0; grounded = true; }
  px = Math.max(1.2, Math.min(WX - 1.2, px));
  pz = Math.max(1.2, Math.min(WZ - 1.2, pz));
  if (inWater) {
    vy -= 8 * dt;
    if (keys[" "]) vy = 3.4;
    else { vy += 10 * dt; if (vy > 1.0) vy = 1.0; }
    if (vy < -3) vy = -3;
    grounded = false;
  } else {
    vy -= 24 * dt;
    if (vy < -18) vy = -18;
    if (keys[" "] && grounded) { vy = 8.5; grounded = false; }
  }
  moveY(vy * dt);
  if (py < 1) { py = 1; vy = 0; grounded = true; }
  render(dt);
  frames++; ftime += dt;
  if (ftime >= 1.5) {
    const fps = frames / ftime;
    if (fps < 22 && Q > 0.4) { Q = Math.max(0.4, Q * 0.85); fit(); }
    else if (fps > 55 && Q < 1) { Q = Math.min(1, Q + 0.1); fit(); }
    fpsEl.textContent = Math.round(fps) + " fps · " + BW + "x" + BH;
    posEl.textContent = "x" + px.toFixed(0) + " z" + pz.toFixed(0) + (inWater ? " · 🏊" : "");
    frames = 0; ftime = 0;
  }
  requestAnimationFrame(loop);
}

// ================= INPUT =================
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === "-") { PIX = Math.max(90, PIX - 10); fit(); }
  if (k === "=" || k === "+") { PIX = Math.min(220, PIX + 10); fit(); }
  if (k === "n") { dayT = (dayT + 0.25) % 1; autoDay = false; }
  if (k === "h") { autoDay = !autoDay; }
  if (k === "f") { const s = document.getElementById("scan"); s.style.display = s.style.display === "none" ? "block" : "none"; }
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
overlay.addEventListener("click", () => screen.requestPointerLock());
screen.addEventListener("click", () => { if (!locked) screen.requestPointerLock(); });
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === screen;
  overlay.classList.toggle("hidden", locked);
});
document.addEventListener("mousemove", e => {
  if (!locked) return;
  yaw -= e.movementX * 0.0026;
  pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.0026));
});

fit(); setTimeout(fit, 60);
requestAnimationFrame(loop);
</script>
